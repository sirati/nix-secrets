[package]
name = "nix-secrets-deploy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
nix = { version = "0.29", features = ["fs", "user"] }
nix-secrets-core = { path = "../core" }
nix-secrets-transport = { path = "../transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "nix_secrets_deploy"
path = "src/lib.rs"

[[bin]]
name = "secret-deploy"
path = "src/main.rs"
