[package]
name = "nix-secrets-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[lib]
name = "nix_secrets_transport"
path = "src/lib.rs"

[[bin]]
name = "nix-secrets-forward-receiver"
path = "src/bin/forward-receiver.rs"
