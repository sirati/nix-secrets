[package]
name = "nix-secrets-storagebox-bootstrap"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
getrandom = "0.4.2"
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
russh-sftp = "3.0.0"
serde = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "getrandom", "std"] }
thiserror = "2"
time = { version = "0.3.45", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "rt-multi-thread"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3"
