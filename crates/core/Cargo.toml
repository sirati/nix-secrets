[package]
name = "nix-secrets-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
regex = "1"
rustix = { version = "1.1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
