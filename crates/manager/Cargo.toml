[package]
name = "nix-secrets-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
getrandom = "0.4.2"
nix-secrets-core = { path = "../core" }
nix-secrets-crypto = { path = "../crypto" }
nix-secrets-transport = { path = "../transport" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rustix = { version = "1", features = ["net", "process"] }
serde_json = "1"
ssh-key = "0.6.7"
zeroize = "1"
command-fds = "0.3.3"
sha2 = "0.10"
unicode-width = "0.2"
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
nix-secrets-deploy = { path = "../deploy" }
tempfile = "3"
toml = "0.9"

[[bin]]
name = "nix-secrets"
path = "src/main.rs"

[[bin]]
name = "nix-secrets-1password"
path = "src/bin/nix-secrets-1password.rs"
