[package]
name = "nix-secrets-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
getrandom = "0.4.2"
nix-secrets-core = { path = "../core" }
nix-secrets-crypto = { path = "../crypto" }
nix-secrets-transport = { path = "../transport" }
ratatui = "0.29"
rustix = { version = "1", features = ["net", "process"] }
serde_json = "1"
ssh-key = "0.6.7"
zeroize = "1"
unicode-width = "0.2"

[[bin]]
name = "nix-secrets"
path = "src/main.rs"
